[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
startCommand = "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
releaseCommand = "python manage.py migrate --noinput && (python manage.py sync_products_from_google_sheet || true) && (python manage.py sync_customers_from_google_sheet || true)"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
