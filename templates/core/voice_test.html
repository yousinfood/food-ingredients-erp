{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語音錄製測試 v3</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }
    .v3-page {
      width: min(520px, 100%);
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 28px 20px 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .v3-title {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
    }
    .v3-subtitle {
      margin: 0 0 24px;
      font-size: 16px;
      text-align: center;
      color: #6b7280;
      line-height: 1.5;
    }
    .v3-btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      background: #16a34a;
      color: #fff;
    }
    .v3-btn--recording {
      background: #dc2626;
    }
    .v3-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .v3-btn--secondary {
      margin-top: 16px;
      background: #2563eb;
    }
    .v3-hint,
    .v3-timer {
      margin: 14px 0 0;
      text-align: center;
      font-size: 18px;
      color: #374151;
    }
    .v3-timer {
      font-size: 24px;
      font-weight: 700;
      color: #dc2626;
    }
    .v3-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }
    .v3-section-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
      color: #374151;
    }
    .v3-meta {
      display: grid;
      gap: 8px;
      margin: 0 0 16px;
      font-size: 17px;
      line-height: 1.5;
    }
    .v3-meta dt {
      font-weight: 700;
      color: #6b7280;
      display: inline;
    }
    .v3-meta dd {
      margin: 0;
      display: inline;
      word-break: break-all;
    }
    .v3-audio-player {
      width: 100%;
      margin-top: 8px;
    }
    .v3-result-box {
      margin: 0;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      color: #374151;
    }
    .v3-result-box--success {
      background: #ecfdf5;
      border-color: #86efac;
      color: #166534;
    }
    .v3-result-box--no-sound {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }
    .v3-result-box--format {
      background: #fff7ed;
      border-color: #fdba74;
      color: #9a3412;
    }
    .v3-result-box--not-configured {
      background: #fefce8;
      border-color: #fde047;
      color: #854d0e;
    }
    .v3-result-box--openai {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #991b1b;
    }
    .v3-result-box--empty {
      background: #f3f4f6;
      border-color: #d1d5db;
      color: #374151;
    }
  </style>
</head>
<body>
  <main class="v3-page" id="voice-test-v3-app">
    <h1 class="v3-title">🎤 語音錄製測試 v3</h1>
    <p class="v3-subtitle">獨立測試頁：先錄音、播放確認，再送出辨識</p>

    <button type="button" class="v3-btn" id="v3-record-btn">開始錄音</button>
    <p class="v3-hint" id="v3-record-hint">按一下開始錄音，再按一下停止</p>
    <p class="v3-timer" id="v3-record-timer" hidden aria-live="polite"></p>

    <section class="v3-section" id="v3-playback-section" hidden>
      <h2 class="v3-section-title">錄音預覽</h2>
      <dl class="v3-meta">
        <div><dt>錄音秒數：</dt> <dd id="v3-meta-duration">—</dd></div>
        <div><dt>Blob bytes：</dt> <dd id="v3-meta-bytes">—</dd></div>
        <div><dt>MIME type：</dt> <dd id="v3-meta-mime">—</dd></div>
      </dl>
      <audio class="v3-audio-player" id="v3-audio-player" controls playsinline></audio>
      <button type="button" class="v3-btn v3-btn--secondary" id="v3-transcribe-btn" disabled>送出辨識</button>
    </section>

    <section class="v3-section" id="v3-result-section" hidden>
      <h2 class="v3-section-title">辨識結果</h2>
      <div class="v3-result-box" id="v3-result-box" hidden aria-live="polite"></div>
    </section>
  </main>

  <script>
    window.VOICE_TEST_V3_CONFIG = {
      transcribeUrl: "{% url 'voice_transcribe_api' %}"
    };
  </script>
  <script src="{% static 'js/customer_search_live.js' %}?v=20260803live-v1" defer></script>
  <script src="{% static 'js/voice_search_v3.js' %}?v=20260802-v3" defer></script>
</body>
</html>
