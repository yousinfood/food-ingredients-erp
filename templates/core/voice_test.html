{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenAI 語音測試</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .voice-test {
      width: min(480px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .voice-test__title {
      margin: 0 0 24px;
      font-size: 28px;
      text-align: center;
    }
    .voice-test__btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      background: #16a34a;
      color: #fff;
    }
    .voice-test__btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .voice-test__status {
      margin-top: 20px;
      min-height: 28px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
    }
    .voice-test__status--recording {
      color: #fff;
      background: #dc2626;
      border-radius: 10px;
      padding: 12px 16px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .voice-test__status--processing {
      color: #2563eb;
    }
    .voice-test__result {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }
    .voice-test__result-label {
      margin: 0 0 12px;
      font-size: 18px;
      color: #6b7280;
    }
    .voice-test__result-text {
      margin: 0;
      font-size: 26px;
      line-height: 1.5;
      word-break: break-word;
    }
    .voice-test__error {
      margin-top: 16px;
      color: #dc2626;
      font-size: 18px;
      text-align: center;
      white-space: pre-wrap;
    }
    .voice-test__capability,
    .voice-test__debug {
      margin-top: 16px;
      padding: 12px 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: #374151;
      white-space: pre-wrap;
    }
    .voice-test__capability-label,
    .voice-test__debug-label {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 700;
      color: #6b7280;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }
  </style>
</head>
<body>
  <main class="voice-test" id="voice-test-app">
    <h1 class="voice-test__title">🎤 OpenAI 語音測試</h1>

    <button type="button" class="voice-test__btn" id="voice-test-start">開始錄音</button>

    <div class="voice-test__capability" id="voice-test-capability" hidden aria-live="polite"></div>

    <div class="voice-test__status" id="voice-test-status" hidden aria-live="polite"></div>
    <p class="voice-test__error" id="voice-test-error" hidden></p>

    <div id="voice-test-debug-wrap">
      <p class="voice-test__debug-label">執行結果</p>
      <div class="voice-test__debug" id="voice-test-debug" hidden aria-live="polite"></div>
    </div>

    <section class="voice-test__result" id="voice-test-result" hidden>
      <p class="voice-test__result-label">辨識結果：</p>
      <p class="voice-test__result-text" id="voice-test-result-text"></p>
    </section>
  </main>

  <script>
    window.VOICE_TEST_CONFIG = {
      transcribeUrl: "{% url 'voice_transcribe_api' %}",
      recordMs: 8000
    };
  </script>
  <script src="{% static 'js/voice_test.js' %}?v=20260730voice-test-002" defer></script>
</body>
</html>
