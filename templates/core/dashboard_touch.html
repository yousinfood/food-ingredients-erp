{% extends "touch_base.html" %}
{% load touch_search %}

{% block title %}搜尋客戶{% endblock %}

{% block extra_head %}
  <meta name="theme-color" content="#ffffff">
  <style>
    .touch-home-app--senior .touch-home-senior__input {
      box-sizing: border-box;
      display: block;
      width: 100%;
      min-height: 72px;
      height: 72px;
      padding: 0 1.15rem;
      font-family: inherit;
      font-size: 28px;
      font-weight: 600;
      color: #243638;
      background: #f8fbfb;
      border: 2px solid #afc8cc;
      border-radius: 16px;
      -webkit-appearance: none;
    }

    .touch-home-app--senior .touch-home-senior__input::placeholder {
      color: #536b6e;
      opacity: 1;
    }

    .touch-home-app--senior .touch-home-senior__input:focus {
      outline: none;
      border-color: #79aeb5;
      box-shadow: none;
    }

    .touch-home-app--senior .touch-home-senior__or {
      margin: 1.1rem 0;
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      color: #64748b;
    }

    .touch-home-app--senior #voice-search-button {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      width: 100%;
      min-height: 100px;
      height: auto;
      margin: 0;
      padding: 0.85rem 1rem;
      border: 2px solid #79aeb5;
      border-radius: 18px;
      font-family: inherit;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.25;
      color: #245c63;
      background: #dceff2;
      box-shadow: 0 4px 12px rgba(36, 92, 99, 0.15);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .touch-home-app--senior .voice-search-button__line1,
    .touch-home-app--senior .voice-search-button__line2 {
      display: block;
      width: 100%;
      text-align: center;
    }

    .touch-home-app--senior .voice-search-button__line1 {
      font-size: 32px;
    }

    .touch-home-app--senior .voice-search-button__line2 {
      font-size: 26px;
      font-weight: 700;
    }

    .touch-home-app--senior #voice-search-button.voice-search-button--idle .voice-search-button__line2 {
      display: block;
    }

    .touch-home-app--senior #voice-search-button.voice-search-button--starting,
    .touch-home-app--senior #voice-search-button.voice-search-button--listening {
      color: #a33a3a;
      background: #ffe7e7;
      border-color: #e8a8a8;
      animation: voice-search-senior-pulse 1.3s ease-in-out infinite;
    }

    .touch-home-app--senior #voice-search-button.voice-search-button--starting .voice-search-button__line2,
    .touch-home-app--senior #voice-search-button.voice-search-button--success .voice-search-button__line2 {
      display: none;
    }

    .touch-home-app--senior #voice-search-button.voice-search-button--listening .voice-search-button__line2 {
      display: block;
      font-size: 28px;
    }

    .touch-home-app--senior #voice-search-button.voice-search-button--success {
      color: #166534;
      background: #dcfce7;
      border-color: #86efac;
      animation: none;
    }

    .touch-home-app--senior #voice-search-button.voice-search-button--error {
      color: #a33a3a;
      background: #ffe7e7;
      border-color: #e8a8a8;
      animation: none;
    }

    .touch-home-app--senior #voice-search-button.voice-search-button--blocked {
      opacity: 0.85;
      cursor: not-allowed;
    }

    .touch-home-app--senior #voice-search-button:disabled {
      cursor: wait;
    }

    @keyframes voice-search-senior-pulse {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(163, 58, 58, 0.35), 0 4px 12px rgba(36, 92, 99, 0.12);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(163, 58, 58, 0), 0 4px 12px rgba(36, 92, 99, 0.12);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .touch-home-app--senior #voice-search-button.voice-search-button--listening,
      .touch-home-app--senior #voice-search-button.voice-search-button--starting {
        animation: none;
      }

      .touch-home-app--senior #voice-search-button:active {
        transform: none;
      }
    }

    .touch-home-app--senior #voice-search-button.voice-search-button--idle:active {
      background: #c7e3e7;
      transform: scale(0.98);
    }

    .touch-home-app--senior .touch-home-senior__hint {
      margin: 1rem 0 0;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.45;
      text-align: center;
      color: #536b6e;
    }

    .touch-home-app--senior .voice-search-failure {
      margin: 1rem 0 0;
      padding: 0.5rem 0.25rem;
      text-align: center;
    }

    .touch-home-app--senior .voice-search-failure[hidden] {
      display: none;
    }

    .touch-home-app--senior .voice-search-failure__title {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.35;
      color: #a33a3a;
    }

    .touch-home-app--senior .voice-search-failure__sub {
      margin: 0.45rem 0 0;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.4;
      color: #536b6e;
    }

    .touch-home-app--senior #voice-search-retry {
      box-sizing: border-box;
      display: block;
      width: 100%;
      min-height: 88px;
      margin: 0.85rem 0 0;
      padding: 0.75rem 1rem;
      border: 2px solid #79aeb5;
      border-radius: 18px;
      font-family: inherit;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.25;
      color: #245c63;
      background: #dceff2;
      box-shadow: 0 4px 12px rgba(36, 92, 99, 0.15);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .touch-home-app--senior #voice-search-retry[hidden] {
      display: none;
    }

    .touch-home-app--senior #customer-search-clear {
      box-sizing: border-box;
      display: block;
      width: 100%;
      min-height: 64px;
      margin: 0.65rem 0 0;
      padding: 0.5rem 1rem;
      border: 2px solid #afc8cc;
      border-radius: 14px;
      font-family: inherit;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      color: #536b6e;
      background: #f8fbfb;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .touch-home-app--senior #customer-search-clear[hidden] {
      display: none;
    }

    .touch-home-app--senior .touch-home-app__results {
      box-sizing: border-box;
      width: 100%;
      padding: 0.5rem 0 1.25rem;
    }

    .touch-home-app--senior .customer-search-results-panel {
      width: 100%;
      box-sizing: border-box;
    }

    .touch-home-app--senior .customer-search-results-panel__heading {
      margin: 0.25rem 0 1rem;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.3;
      color: #243638;
      text-align: left;
    }

    .touch-home-app--senior .customer-search-results-panel__list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .touch-home-app--senior .customer-search-result-card {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.35rem;
      width: 100%;
      min-height: 96px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      background: #f8fbfb;
      border: 2px solid #afc8cc;
      border-radius: 16px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.12s ease, transform 0.12s ease;
    }

    .touch-home-app--senior .customer-search-result-card__name {
      display: block;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.25;
      color: #243638;
      word-break: break-word;
    }

    .touch-home-app--senior .customer-search-result-card__region {
      display: block;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.35;
      color: #536b6e;
      word-break: break-word;
    }

    .touch-home-app--senior .customer-search-result-card__address {
      display: block;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.4;
      color: #536b6e;
      word-break: break-word;
    }

    .touch-home-app--senior .customer-search-result-card--pressed,
    .touch-home-app--senior .customer-search-result-card:active {
      background: #dceff2;
      transform: scale(0.99);
    }

    .touch-home-app--senior .customer-search-results-panel__more {
      box-sizing: border-box;
      width: 100%;
      min-height: 64px;
      margin-top: 14px;
      padding: 0.85rem 1rem;
      font-family: inherit;
      font-size: 26px;
      font-weight: 700;
      color: #245c63;
      background: #f8fbfb;
      border: 2px solid #afc8cc;
      border-radius: 14px;
      cursor: pointer;
    }

    .touch-home-app--senior .customer-search-results-panel mark,
    .touch-home-app--senior .customer-search-results-panel .touch-search-highlight {
      background: #fef08a;
      color: inherit;
      padding: 0 0.12em;
      border-radius: 4px;
    }
  </style>
{% endblock %}

{% block body %}
<main class="touch-main touch-home-app touch-home-app--senior">
  <div class="touch-home-app__search-sticky">
    <h1 class="touch-home-app__title">搜尋客戶</h1>

    <form action="{% url 'dashboard' %}" method="get" class="touch-search-form touch-search-form--hero touch-search-form--home-app" data-touch-home-search="1">
      <div class="touch-search-input-row touch-search-input-row--solo">
        <input
          type="search"
          name="q"
          id="customer-search-input"
          value="{{ query }}"
          class="touch-search-input touch-search-input--hero touch-search-input--home touch-home-senior__input"
          placeholder="輸入客戶名稱"
          autofocus
          enterkeyhint="search"
          inputmode="search"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        >
      </div>

      <button type="button" id="customer-search-clear" hidden>清除重來</button>

      <p class="touch-home-senior__or" aria-hidden="true">或</p>

      <button
        type="button"
        id="voice-search-button"
        class="voice-search-button voice-search-button--idle"
        aria-label="按這裡說話找客戶"
        aria-pressed="false"
      >
        <span class="voice-search-button__line1">🎤 按這裡說話找客戶</span>
        <span class="voice-search-button__line2">點一下，再說客戶名稱</span>
      </button>

      <div id="voice-search-failure" class="voice-search-failure" hidden aria-live="polite">
        <p class="voice-search-failure__title">沒有找到這位客戶</p>
        <p class="voice-search-failure__sub">請再說一次</p>
      </div>

      <button type="button" id="voice-search-retry" hidden>🎤 重新說一次</button>

      <p class="touch-home-senior__hint">可以說店名、老闆名字、電話或地區</p>
    </form>
  </div>

  <div id="touch-search-results-mount" class="touch-home-app__results">
  {% include "core/_customer_search_results_home.html" %}
  </div>
</main>
{% endblock %}
