{% extends "touch_base.html" %}
{% load touch_search %}

{% block title %}搜尋客戶{% endblock %}

{% block extra_head %}
  <meta name="theme-color" content="#ffffff">
  <style>
    .touch-home-app--senior .touch-home-senior__input {
      box-sizing: border-box;
      display: block;
      width: 100%;
      min-height: 72px;
      height: 72px;
      padding: 0 1.15rem;
      font-family: inherit;
      font-size: 28px;
      font-weight: 600;
      color: #243638;
      background: #f8fbfb;
      border: 2px solid #afc8cc;
      border-radius: 16px;
      -webkit-appearance: none;
    }

    .touch-home-app--senior .touch-home-senior__input::placeholder {
      color: #536b6e;
      opacity: 1;
    }

    .touch-home-app--senior .touch-home-senior__input:focus {
      outline: none;
      border-color: #79aeb5;
      box-shadow: none;
    }

    .touch-home-app--senior .touch-home-senior__or {
      margin: 1.1rem 0;
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      color: #64748b;
    }

    .touch-home-app--senior #voice-search-button {
      box-sizing: border-box;
      display: block;
      width: 100%;
      height: 100px;
      margin: 0;
      padding: 0 1rem;
      border: 2px solid #79aeb5;
      border-radius: 18px;
      font-family: inherit;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      color: #245c63;
      background: #dceff2;
      box-shadow: 0 4px 12px rgba(36, 92, 99, 0.15);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .touch-home-app--senior #voice-search-button:active {
      background: #c7e3e7;
      transform: scale(0.98);
    }

    @media (prefers-reduced-motion: reduce) {
      .touch-home-app--senior #voice-search-button {
        transition: background 0.15s ease;
      }

      .touch-home-app--senior #voice-search-button:active {
        transform: none;
      }
    }

    .touch-home-app--senior .touch-home-senior__hint {
      margin: 1rem 0 0;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.45;
      text-align: center;
      color: #536b6e;
    }
  </style>
{% endblock %}

{% block body %}
<main class="touch-main touch-home-app touch-home-app--senior">
  <div class="touch-home-app__search-sticky">
    <h1 class="touch-home-app__title">搜尋客戶</h1>

    <form action="{% url 'dashboard' %}" method="get" class="touch-search-form touch-search-form--hero touch-search-form--home-app" data-touch-home-search="1">
      <div class="touch-search-input-row touch-search-input-row--solo">
        <input
          type="search"
          name="q"
          id="touch-home-search-input"
          value="{{ query }}"
          class="touch-search-input touch-search-input--hero touch-search-input--home touch-home-senior__input"
          placeholder="輸入客戶名稱"
          autofocus
          enterkeyhint="search"
          inputmode="search"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        >
      </div>

      <p class="touch-home-senior__or" aria-hidden="true">或</p>

      <button type="button" id="voice-search-button">🎤 語音找客戶</button>

      <p class="touch-home-senior__hint">可以說店名、老闆名字、電話或地區</p>
    </form>
  </div>

  <div id="touch-search-results-mount" class="touch-home-app__results">
  {% include "core/_customer_search_results_home.html" %}
  </div>
</main>
{% endblock %}
