{% extends "touch_base.html" %}
{% load touch_search %}

{% block title %}搜尋客戶{% endblock %}

{% block extra_head %}
  <meta name="theme-color" content="#ffffff">
{% endblock %}

{% block body %}
<h1 style="color:red;font-size:60px">TEST123</h1>
<main class="touch-main touch-home-app">
  <div class="touch-home-app__search-sticky">
    <h1 class="touch-home-app__title">搜尋客戶</h1>

    <form action="{% url 'dashboard' %}" method="get" class="touch-search-form touch-search-form--hero touch-search-form--home-app" data-touch-home-search="1">
      <div class="touch-search-input-row touch-search-input-row--solo">
        <input
          type="search"
          name="q"
          id="touch-home-search-input"
          value="{{ query }}"
          class="touch-search-input touch-search-input--hero touch-search-input--home"
          placeholder="搜尋客戶"
          autofocus
          enterkeyhint="search"
          inputmode="search"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        >
      </div>

      <button
        type="button"
        id="task001-voice-placeholder"
        style="display:block;box-sizing:border-box;width:100%;height:100px;margin:1rem 0 0;padding:0;border:none;border-radius:16px;font-family:inherit;font-size:32px;font-weight:800;line-height:1.2;color:#fff;background:#1e3a5f;cursor:default;-webkit-tap-highlight-color:transparent;"
      >🎤 語音找客戶</button>
    </form>
  </div>

  <div id="touch-search-results-mount" class="touch-home-app__results">
  {% include "core/_customer_search_results_home.html" %}
  </div>
</main>
{% endblock %}
